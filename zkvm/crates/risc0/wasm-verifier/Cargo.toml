[package]
name = "r0-wasm-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen risc0 succinct-receipt verifier (verify-only risc0-zkvm build; runs in browser + Node)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# verify-only: no prover, compiles to wasm32-unknown-unknown (S2-validated).
# `disable-dev-mode` matches the prover host: this crate is the client-side
# re-verification boundary against an untrusted hosted prover, so a native
# build (rlib, tests) must never let RISC0_DEV_MODE downgrade `Receipt::verify`
# into accepting a fake receipt.
risc0-zkvm = { version = "3.0.6", default-features = false, features = [
    "std",
    "disable-dev-mode",
] }
wasm-bindgen = "0.2"
bincode = "1.3"
hex = "0.4"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
