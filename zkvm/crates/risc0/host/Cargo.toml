[package]
name = "zkdeal-r0"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "risc0 STF prover/verifier host — JSON-over-stdio (matches server/src/zkvm-assist.ts and @zkdeal/zkvm risc0-node)"

[[bin]]
name = "zkdeal-r0"
path = "src/main.rs"

[dependencies]
r0-methods = { path = "../methods" }
risc0-zkvm = { version = "3.0.6", features = ["prove", "disable-dev-mode"] }
risc0-groth16 = { version = "3.0.5", default-features = false, features = ["prove"] }
risc0-circuit-recursion = { version = "4.0.5", default-features = false }
risc0-zkp = { version = "3.0.5", default-features = false }
stf-types = { workspace = true }
stf-core = { path = "../../stf-core" }
stf-wire = { path = "../../stf-wire", features = ["json"] }
serde_json = { workspace = true }
serde = { workspace = true }
bincode = "1.3"
c-kzg = { version = "=2.1.8", features = ["ethereum_kzg_settings"] }
base64 = "0.22"
hex = "0.4"
anyhow = "1"
sha2 = "0.10"
libc = "0.2"
alloy-primitives = { workspace = true }
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-rlp = { workspace = true }
alloy-trie = { workspace = true }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

[features]
# Production images MUST be built with `--features production`. Keeping the
# feature opt-in lets ordinary developer machines compile execute/verify code
# without a CUDA toolkit while the runtime production guard still fails
# closed if an incorrectly-built binary is deployed.
default = []
cuda = ["risc0-zkvm/cuda", "risc0-groth16/cuda"]
production = ["cuda"]
# Headless room members execute the canonical guest input and verify receipts,
# but must never become an accidental CPU prover.  This feature is used for a
# separately pinned client binary whose command dispatcher rejects every
# proving/server entrypoint at runtime.
client-verifier = []
