# zkdeal STF risc0 guest. Standalone workspace (risc0 guest builds run in
# their own cargo invocation / docker container); path deps resolve inside the
# zkvm/ docker build context (see ../build.rs).
[package]
name = "stf-guest"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["std", "unstable"] }
stf-core = { path = "../../../stf-core" }
stf-types = { path = "../../../stf-types" }
# Alloy centralizes Ethereum Keccak behind this exact native hook. The guest
# supplies the hook from RISC Zero's recursively verified Keccak accelerator,
# so trie, transaction, EVM and journal hashes all benefit without changing
# their byte-level semantics or the final receipt format.
alloy-primitives = { version = "1", default-features = false, features = ["native-keccak"] }
bincode = "1.3"

[features]
default = []
# A/B benchmark only. The production guest never enables this feature.
opcode-gadget-baseline = ["stf-core/disable-opcode-gadgets"]

# Keep accelerator overrides explicit and lockfile-pinned. Alloy 1.6's
# `native-keccak` ABI is implemented in `native_keccak.rs`; a tiny-keccak patch
# would still be silently unused and must not be substituted for that bridge.
[patch.crates-io]
# Transaction sender recovery and the ECRECOVER precompile both flow through
# k256 in this guest. Use RISC Zero's drop-in accelerator-backed fork so an
# arbitrary room contract bundle benefits without changing EVM semantics.
k256 = { path = "../../../../vendor/rustcrypto-k256" }
# The accelerated k256 tag imports the RISC Zero bigint syscall adapter. Pin
# the exact companion fork declared by that tag's upstream workspace; mixing
# it with crates.io crypto-bigint compiles on the host but fails for the guest.
crypto-bigint = { path = "../../../../vendor/rustcrypto-crypto-bigint" }

[profile.release]
lto = true
opt-level = 3
